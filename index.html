<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mines</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="jogo">
        <h1>Mines</h1>

        <p>
            Escolha a quantidade de minas e tente encontrar
            todas as casas seguras.
        </p>

        <div class="controles">
            <label for="quantidade-minas">
                Quantidade de minas:
            </label>

            <select id="quantidade-minas">
                <option value="1">1</option>
                <option value="3" selected>3</option>
                <option value="5">5</option>
                <option value="7">7</option>
                <option value="10">10</option>
            </select>

            <button id="botao-iniciar">
                Iniciar jogo
            </button>
        </div>

        <div class="informacoes">
            <p>
                Pontos:
                <span id="pontos">0</span>
            </p>

            <p id="mensagem">
                Clique em "Iniciar jogo".
            </p>
        </div>

        <div id="tabuleiro">
            <button class="casa" id="casa-1"></button>
            <button class="casa" id="casa-2"></button>
            <button class="casa" id="casa-3"></button>
            <button class="casa" id="casa-4"></button>
            <button class="casa" id="casa-5"></button>

            <button class="casa" id="casa-6"></button>
            <button class="casa" id="casa-7"></button>
            <button class="casa" id="casa-8"></button>
            <button class="casa" id="casa-9"></button>
            <button class="casa" id="casa-10"></button>

            <button class="casa" id="casa-11"></button>
            <button class="casa" id="casa-12"></button>
            <button class="casa" id="casa-13"></button>
            <button class="casa" id="casa-14"></button>
            <button class="casa" id="casa-15"></button>

            <button class="casa" id="casa-16"></button>
            <button class="casa" id="casa-17"></button>
            <button class="casa" id="casa-18"></button>
            <button class="casa" id="casa-19"></button>
            <button class="casa" id="casa-20"></button>

            <button class="casa" id="casa-21"></button>
            <button class="casa" id="casa-22"></button>
            <button class="casa" id="casa-23"></button>
            <button class="casa" id="casa-24"></button>
            <button class="casa" id="casa-25"></button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
